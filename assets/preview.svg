<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="Segoe UI, Segoe UI Variable, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-50%" width="140%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="frame"><rect width="820" height="360" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="820" height="360" fill="url(#bg)"/>
    <rect width="820" height="360" fill="url(#glow)"/>

    <!-- on-screen popup -->
    <g transform="translate(290 196)" filter="url(#shadow)">
      <rect width="240" height="60" rx="12" fill="#202020" fill-opacity="0.95"/>
      <rect x="14" y="13" width="34" height="34" rx="8" fill="#16A34A"/>
      <text x="31" y="38.5" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">A</text>
      <text x="60" y="36" font-size="17" fill="#fff">Caps Lock</text>
      <text x="222" y="36" font-size="16" font-weight="700" fill="#fff" text-anchor="end">ON</text>
    </g>

    <!-- tooltip -->
    <g transform="translate(548 262)">
      <rect width="112" height="30" rx="6" fill="#2b2b2b" stroke="#3f3f3f"/>
      <text x="56" y="20" font-size="13" fill="#e5e7eb" text-anchor="middle">Caps Lock: ON</text>
    </g>

    <!-- taskbar -->
    <rect y="312" width="820" height="48" fill="#1c1c1c" fill-opacity="0.97"/>
    <rect y="312" width="820" height="1" fill="#ffffff" fill-opacity="0.08"/>

    <!-- start + pinned apps -->
    <g transform="translate(300 324)">
      <rect x="0" y="0" width="11" height="11" rx="1.5" fill="#4cc2ff"/>
      <rect x="13" y="0" width="11" height="11" rx="1.5" fill="#4cc2ff"/>
      <rect x="0" y="13" width="11" height="11" rx="1.5" fill="#4cc2ff"/>
      <rect x="13" y="13" width="11" height="11" rx="1.5" fill="#4cc2ff"/>
      <rect x="48" y="0" width="24" height="24" rx="6" fill="#3a3a3a"/>
      <rect x="96" y="0" width="24" height="24" rx="6" fill="#3a3a3a"/>
      <rect x="144" y="0" width="24" height="24" rx="6" fill="#3a3a3a"/>
      <rect x="192" y="0" width="24" height="24" rx="6" fill="#3a3a3a"/>
    </g>

    <!-- tray -->
    <path d="M560 340 l6 -6 l6 6" fill="none" stroke="#d4d4d4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="584" y="316" width="36" height="40" rx="5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="592" y="326" width="20" height="20" rx="4.8" fill="#16A34A"/>
    <text x="602" y="341.5" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">A</text>

    <rect x="626" y="326" width="20" height="20" rx="4.8" fill="#2563EB"/>
    <text x="636" y="341.5" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">1</text>

    <text x="676" y="341" font-size="12" fill="#e5e5e5" text-anchor="middle">ENG</text>
    <text x="760" y="332" font-size="12" fill="#e5e5e5" text-anchor="middle">11:53</text>
    <text x="760" y="348" font-size="12" fill="#e5e5e5" text-anchor="middle">30/9/2026</text>
  </g>
</svg>
